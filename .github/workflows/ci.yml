name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 變更檢測（決定需要執行哪些檢查）
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'templates/**'
              - 'content/**'
              - 'static/**'
              - 'Containerfile'
            k8s:
              - 'k8s/**'

  # ============================================
  # Rust 檢查與頁面驗證（頁面由 Rust 產生，輸出之後再驗 HTML）
  # ============================================
  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-check"
          cache-targets: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build
        run: cargo build --release --locked
      - name: Render pages
        run: |
          cargo run --release --locked -- render site
          cp -r static/. site/
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: site/
          css: true

  rust-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 容器構建驗證
  # NOTE: CI uses Docker for convenience in GitHub Actions environment.
  # Production deployment uses Podman + k3s (no Docker daemon required).
  # ============================================
  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: |
      always() &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.changes.outputs.rust == 'true' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: thc1006-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container starts
        run: |
          docker run -d --name test-container -p 8080:8080 thc1006-web:ci
          sleep 3
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/PE/ || exit 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404
          docker stop test-container

  # ============================================
  # Kubernetes 配置驗證
  # ============================================
  k8s-validate:
    name: K8s Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.k8s == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: yokawasa/action-setup-kube-tools@v0.11.1
        with:
          kubeconform: '0.6.7'
      - name: Validate K8s manifests
        run: kubeconform -strict -summary k8s/*.yaml

  # ============================================
  # 依賴授權檢查
  # ============================================
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
