<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, minimum-scale=1, width=device-width">
  <title>404 - 你迷路了嗎？</title>
  <meta name="robots" content="noindex">
{% include "ga.html" %}
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html {
      font: 15px/1.5 Georgia, "Noto Serif TC", serif;
      background: #fff;
      color: #333;
      padding: 15px;
      height: 100vh;
      overflow: auto;
    }

    body {
      max-width: 680px;
      margin: 2% auto 0;
    }

    h1 {
      font-size: 4em;
      font-weight: normal;
      margin: 0;
      color: #999;
      text-align: center;
      letter-spacing: 0.05em;
    }

    h2 {
      font-size: 1.1em;
      font-weight: normal;
      text-align: center;
      margin: 0.3em 0 0.8em;
      color: #666;
    }

    .section {
      margin: 0.8em 0;
      padding: 0.6em 0.8em;
      border-left: 2px solid #ddd;
    }

    .section-title {
      font-size: 0.95em;
      font-weight: bold;
      margin-bottom: 0.4em;
      color: #555;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 0.3em 0;
      padding-left: 1.5em;
      position: relative;
    }

    li:before {
      content: "•";
      position: absolute;
      left: 0;
      color: #999;
    }

    .quote {
      font-style: italic;
      color: #666;
      margin: 0.8em 0;
      padding: 0.6em 0.8em;
      background: #f9f9f9;
      border-left: 3px solid #ccc;
      font-size: 0.9em;
    }

    a {
      color: #0066cc;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-bottom 0.2s;
    }

    a:hover {
      border-bottom: 1px solid #0066cc;
    }

    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border: 1px solid #e0e0e0;
      font-family: "Courier New", monospace;
      font-size: 0.9em;
      color: #c7254e;
    }

    .footer {
      text-align: center;
      margin-top: 0.8em;
      padding-top: 0.6em;
      border-top: 1px solid #eee;
      color: #888;
      font-size: 0.85em;
    }

    .gif-left, .gif-right {
      float: left;
      width: 140px;
      height: 100px;
      object-fit: cover;
      border: 1px solid #e0e0e0;
      margin-right: 15px;
      margin-bottom: 10px;
    }

    .gif-right {
      float: right;
      margin-right: 0;
      margin-left: 15px;
    }

    .gif-center {
      display: block;
      max-width: 200px;
      max-height: 120px;
      height: auto;
      margin: 0.8em auto;
      border: 1px solid #e0e0e0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.8em;
      }
      .section {
        padding: 0.5em;
      }
      .gif-left, .gif-right {
        width: 100px;
        height: 75px;
      }
      .gif-center {
        max-width: 150px;
        max-height: 90px;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>恭喜你發現了一個不存在的頁面</h2>

  <img id="gif1" class="gif-left" alt="" src="{{ gifs[0] }}">

  <div class="section">
    <div class="section-title">你要找的 <code id="url">{{ path }}</code> 可能：</div>
    <p style="line-height: 1.6;">還在我的待辦清單裡、正在 ECMO 上搶救中、被發射到外太空找系外行星了、或是在半工半讀的某個深夜被遺忘了。</p>
  </div>

  <img id="gif2" class="gif-right" alt="" src="{{ gifs[1] }}">

  <div class="quote">
    「讀醫讀電資又讀戲劇，技能樹亂點的人生。」<br>
    <small>— 包括把網頁連結也點亂了</small>
  </div>

  <div class="section">
    <div class="section-title">隨機冷知識</div>
    <p id="fact" style="line-height: 1.6;">{{ fact }}</p>
  </div>

  <img id="gif3" class="gif-center" alt="" src="{{ gifs[2] }}">

  <div class="footer">
    不如回到 <a href="https://thc1006.us/">首頁</a> 看看有什麼有趣的？
  </div>

</body>
</html>
