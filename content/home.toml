  "從屏東大鵬灣漁村，一路半工半讀走到雲原生電信、AI RAN 與臨床醫學的交會點：在 <strong>Nephio (LFN)</strong> 做開源治理，在 <strong>WinLab</strong> 做 AI RAN 研究，也在醫院當過路障（2025/07 — 2026 在臺北市立聯合醫院陽明院區內科部臨床輪訓）。高中畢業時家中遭遇重大境遇，曾考慮簽海軍陸戰隊志願役，最後選擇揹學貸進入陽明交大。",
  "曾任雲達科技（QCT）O-RAN OAM Developer Intern（2023/05 — 12）、NARLabs 台灣半導體研究中心駐布拉格人員（2023/11 — 2024/10），以及多個 NYCU 5G / O-RAN 計畫的研究助理。",
  "帶領「語您童行 Tai-Gi」以台語、客語做科普，曾在中研院用全台語演講 5G O-RAN。蘭陽戲劇團「天公疼憨人」飾丑角尚福氣；東港迎王戊戌正科涼傘手；應吳念真導演之邀擔任保力達 B 廣告編劇。",
