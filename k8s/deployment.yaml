apiVersion: apps/v1
kind: Deployment
metadata:
  name: thc1006-web
  namespace: thc1006-web
  labels:
    app.kubernetes.io/name: thc1006-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: thc1006-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thc1006-web
        app.kubernetes.io/component: frontend
    spec:
      # Security: Run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          # NOTE: localhost image works for single-node k3s. For multi-node clusters,
          # push to a registry and change imagePullPolicy to IfNotPresent/Always.
          image: localhost/thc1006-web:1.0.4
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Container security context
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Resource limits
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          # Probes
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Environment variables
          env:
            - name: RUST_LOG
              value: "info"

      # Graceful shutdown
      terminationGracePeriodSeconds: 10
