# Ingress Configuration for thc1006.us
#
# Architecture: Cloudflare (TLS termination) -> k3s Traefik -> Service
#
# TLS is handled by Cloudflare Proxy:
# - Cloudflare terminates HTTPS and forwards HTTP to origin
# - Cloudflare SSL mode should be set to "Flexible" or "Full" in dashboard
# - No TLS certificate needed at k3s level with this architecture
#
# To enable end-to-end encryption (Cloudflare "Full (Strict)" mode):
# 1. Add cert-manager and create a Certificate resource
# 2. Uncomment the spec.tls section below
# 3. Change Cloudflare SSL mode to "Full (Strict)"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thc1006-web
  namespace: thc1006-web
  labels:
    app.kubernetes.io/name: thc1006-web
    app.kubernetes.io/component: frontend
  annotations:
    # Traefik (k3s default ingress controller)
    # Only use 'web' entrypoint since Cloudflare handles TLS
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: thc1006.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thc1006-web
                port:
                  name: http

  # Uncomment below for end-to-end TLS (requires cert-manager):
  # tls:
  #   - hosts:
  #       - thc1006.us
  #     secretName: thc1006-us-tls
